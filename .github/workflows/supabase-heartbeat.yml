name: Supabase Heartbeat

on:
  schedule:
    # Run every 6 hours to keep Supabase free tier from pausing
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -i -X GET \
            'https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/rest/v1/products?limit=1' \
            -H 'apikey: ${{ secrets.SUPABASE_ANON_KEY }}' \
            -H 'Accept: application/json'
      
      - name: Heartbeat Success
        if: success()
        run: echo "✓ Supabase heartbeat successful at $(date)"
      
      - name: Heartbeat Failed
        if: failure()
        run: echo "✗ Supabase heartbeat failed - check credentials"
